<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1180" viewBox="0 0 1620 1180" font-family="Helvetica, Arial, sans-serif"><title>XRSight-RTOS plugin dependencies and execution backends</title><desc>Independent render and timewarp workers share a display timeline. Pose prediction is an on-demand service; eye inference publishes asynchronously.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526b83"/></marker><marker id="clockArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9885b5"/></marker></defs><polyline points="60,145 30,145 30,595 815,595" fill="none" stroke="#9885b5" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5"/>
