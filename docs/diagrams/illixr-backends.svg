<text x="60" y="66" font-size="34" font-weight="700" fill="#182c43">XRSight-RTOS</text>
<text x="62" y="93" font-size="16" font-weight="400" fill="#4f647b">Plugin dependencies and execution backends</text>
<rect x="60" y="112" width="1460" height="64" rx="10" fill="#f5f2f9" stroke="#dfd6ea" stroke-width="1.2"/>
<text x="80" y="138" font-size="12" font-weight="700" fill="#725097">SHARED TARGET CLOCK</text>
<text x="370" y="141" font-size="15" font-weight="700" fill="#182c43">CLINT mtime  /  120 Hz virtual display timeline</text>
<text x="370" y="162" font-size="12" font-weight="400" fill="#4f647b">Independent absolute schedules; GPU waits release the CPU.</text>
<text x="60" y="212" font-size="11" font-weight="700" fill="#637d96">MOTION TRACKING</text>
<text x="815" y="530" font-size="11" font-weight="700" fill="#8668a5">RENDER &amp; DISPLAY</text>
<text x="60" y="666" font-size="11" font-weight="700" fill="#4d855d">ASYNCHRONOUS EYE TRACKING</text>
<rect x="60" y="230" width="280" height="102" rx="10" fill="#edf5fc" stroke="#c0d8ec" stroke-width="1.2"/>
<text x="80" y="263" font-size="18" font-weight="700" fill="#182c43">offline_cam</text>
<text x="80" y="284" font-size="11" font-weight="700" fill="#285c84">CPU  /  TIMESTAMP-PACED</text>
<text x="80" y="308" font-size="13" font-weight="400" fill="#4f647b">Stereo replay; bounded image queue</text>
<rect x="60" y="370" width="280" height="112" rx="10" fill="#edf5fc" stroke="#c0d8ec" stroke-width="1.2"/>
<text x="80" y="403" font-size="18" font-weight="700" fill="#182c43">offline_imu</text>
<text x="80" y="424" font-size="11" font-weight="700" fill="#285c84">CPU  /  TIMESTAMP-PACED</text>
<text x="80" y="448" font-size="13" font-weight="400" fill="#4f647b">IMU replay; separate queues</text>
<text x="80" y="467" font-size="13" font-weight="400" fill="#4f647b">for VIO and integration</text>
<rect x="420" y="230" width="330" height="180" rx="10" fill="#fff5e6" stroke="#ebd3a5" stroke-width="1.2"/>
<text x="440" y="263" font-size="18" font-weight="700" fill="#182c43">openvins</text>
<text x="440" y="284" font-size="11" font-weight="700" fill="#8c601e">CPU  /  RVV  /  FP32 GEMMINI</text>
<text x="440" y="308" font-size="13" font-weight="400" fill="#4f647b">FP64 estimator + image processing</text>
<text x="440" y="327" font-size="13" font-weight="400" fill="#4f647b">Eigen / scalar OpenBLAS / RVV BLAS</text>
<text x="440" y="346" font-size="13" font-weight="400" fill="#4f647b">or FP32 Gemmini GEMM / GEMV</text>
<text x="440" y="365" font-size="13" font-weight="400" fill="#4f647b">with scalar or RVV conversion/packing</text>
<text x="440" y="384" font-size="13" font-weight="400" fill="#4f647b">Publishes the latest VIO baseline</text>
<rect x="815" y="250" width="290" height="120" rx="10" fill="#edf5fc" stroke="#c0d8ec" stroke-width="1.2"/>
<text x="835" y="283" font-size="18" font-weight="700" fill="#182c43">imu_integrator</text>
<text x="835" y="304" font-size="11" font-weight="700" fill="#285c84">CPU  /  FP64 EIGEN</text>
<text x="835" y="328" font-size="13" font-weight="400" fill="#4f647b">VIO baseline + retained IMU history</text>
<text x="835" y="347" font-size="13" font-weight="400" fill="#4f647b">Publishes coherent prediction state</text>
<rect x="1180" y="250" width="330" height="140" rx="10" fill="#edf5fc" stroke="#c0d8ec" stroke-width="1.2"/>
<text x="1200" y="283" font-size="18" font-weight="700" fill="#182c43">pose_prediction</text>
<text x="1200" y="304" font-size="11" font-weight="700" fill="#285c84">CPU  /  RK4 &amp; QUATERNION MATH</text>
<text x="1200" y="328" font-size="13" font-weight="400" fill="#4f647b">Requested-time prediction service</text>
<text x="1200" y="347" font-size="13" font-weight="400" fill="#4f647b">Runs in the caller&#x27;s thread</text>
<text x="1200" y="366" font-size="13" font-weight="400" fill="#4f647b">50 ms horizon; stale-state checks</text>
<rect x="815" y="550" width="290" height="150" rx="10" fill="#f2eefa" stroke="#d2c4e5" stroke-width="1.2"/>
<text x="835" y="583" font-size="18" font-weight="700" fill="#182c43">render_loop</text>
<text x="835" y="604" font-size="11" font-weight="700" fill="#725097">CPU  +  ASYNCHRONOUS GPU MODEL</text>
<text x="835" y="628" font-size="13" font-weight="400" fill="#4f647b">Starts at vsync + 1 ms</text>
<text x="835" y="647" font-size="13" font-weight="400" fill="#4f647b">Predicts the following vsync</text>
<text x="835" y="666" font-size="13" font-weight="400" fill="#4f647b">GPU delay: 6.944445 ms</text>
<text x="835" y="685" font-size="13" font-weight="400" fill="#4f647b">Publishes a dummy stereo frame</text>
<rect x="815" y="785" width="290" height="105" rx="10" fill="#f3f6f9" stroke="#ced9e3" stroke-width="1.2"/>
<text x="835" y="818" font-size="18" font-weight="700" fill="#182c43">Latest completed frame</text>
<text x="835" y="839" font-size="11" font-weight="700" fill="#4f647b">CPU RAM  /  RETAINED SNAPSHOT</text>
<text x="835" y="863" font-size="13" font-weight="400" fill="#4f647b">Immutable descriptor + saved pose</text>
<rect x="60" y="690" width="280" height="115" rx="10" fill="#edf7ef" stroke="#bfdcc7" stroke-width="1.2"/>
<text x="80" y="723" font-size="18" font-weight="700" fill="#182c43">offline_eye</text>
<text x="80" y="744" font-size="11" font-weight="700" fill="#327146">CPU  /  EMBEDDED SAMPLE</text>
<text x="80" y="768" font-size="13" font-weight="400" fill="#4f647b">One repeated 240 x 160 image</text>
<text x="80" y="787" font-size="13" font-weight="400" fill="#4f647b">120 Hz; notifications coalesce</text>
<rect x="420" y="690" width="330" height="165" rx="10" fill="#edf7ef" stroke="#bfdcc7" stroke-width="1.2"/>
<text x="440" y="723" font-size="18" font-weight="700" fill="#182c43">eye_tracking / RITNet</text>
<text x="440" y="744" font-size="11" font-weight="700" fill="#327146">CPU WORKER  +  INT8 GEMMINI</text>
<text x="440" y="768" font-size="13" font-weight="400" fill="#4f647b">Inference worker pinned to hart 0</text>
<text x="440" y="787" font-size="13" font-weight="400" fill="#4f647b">INT8 Gemmini on custom2</text>
<text x="440" y="806" font-size="13" font-weight="400" fill="#4f647b">Completion fence after every operation</text>
<text x="440" y="825" font-size="13" font-weight="400" fill="#4f647b">Publishes image-space eye centroid</text>
<rect x="1180" y="800" width="330" height="150" rx="10" fill="#f2eefa" stroke="#d2c4e5" stroke-width="1.2"/>
<text x="1200" y="833" font-size="18" font-weight="700" fill="#182c43">timewarp</text>
<text x="1200" y="854" font-size="11" font-weight="700" fill="#725097">CPU  +  ASYNCHRONOUS GPU MODEL</text>
<text x="1200" y="878" font-size="13" font-weight="400" fill="#4f647b">Starts at upcoming vsync - 2 ms</text>
<text x="1200" y="897" font-size="13" font-weight="400" fill="#4f647b">Fresh pose + latest frame + latest eye</text>
<text x="1200" y="916" font-size="13" font-weight="400" fill="#4f647b">CPU correction; GPU delay: 1 ms</text>
<text x="1200" y="935" font-size="13" font-weight="400" fill="#4f647b">Eye result is recorded, not applied</text>
<rect x="1180" y="1010" width="330" height="110" rx="10" fill="#f3f6f9" stroke="#ced9e3" stroke-width="1.2"/>
<text x="1200" y="1043" font-size="18" font-weight="700" fill="#182c43">Presentation probe</text>
<text x="1200" y="1064" font-size="11" font-weight="700" fill="#4f647b">CPU  /  MAIN CONSUMER LOOP</text>
<text x="1200" y="1088" font-size="13" font-weight="400" fill="#4f647b">Newest eligible completion at vsync</text>
<text x="1200" y="1107" font-size="13" font-weight="400" fill="#4f647b">New / repeated / no output</text>
<text x="348" y="270" font-size="10" font-weight="400" fill="#4f647b">stereo</text>
<text x="348" y="418" font-size="10" font-weight="400" fill="#4f647b">IMU</text>
<text x="479" y="472" font-size="12" font-weight="400" fill="#4f647b">Independent IMU queue</text>
<text x="756" y="291" font-size="10" font-weight="400" fill="#4f647b">baseline</text>
<text x="1118" y="291" font-size="10" font-weight="400" fill="#4f647b">state</text>
<text x="998" y="478" font-size="12" font-weight="400" fill="#4f647b">Pose for the next vsync</text>
<text x="1410" y="588" font-size="12" font-weight="400" fill="#4f647b">Fresh pose</text>
<text x="1410" y="607" font-size="12" font-weight="400" fill="#4f647b">for warp vsync</text>
<text x="349" y="714" font-size="10" font-weight="400" fill="#4f647b">latest</text>
<text x="349" y="728" font-size="10" font-weight="400" fill="#4f647b">image</text>
<text x="674" y="938" font-size="12" font-weight="400" fill="#4f647b">Latest completed eye result; reuse allowed</text>
<text x="980" y="747" font-size="12" font-weight="400" fill="#4f647b">GPU completion</text>
<text x="1114" y="816" font-size="10" font-weight="400" fill="#4f647b">frame</text>
<text x="1114" y="830" font-size="10" font-weight="400" fill="#4f647b">reuse</text>
<text x="1206" y="985" font-size="12" font-weight="400" fill="#4f647b">Warp completion</text>
<text x="606" y="585" font-size="12" font-weight="400" fill="#9885b5">Vsync + 1 ms</text>
<text x="1519" y="858" font-size="10" font-weight="400" fill="#9885b5">-2 ms</text>
<text x="1519" y="1080" font-size="10" font-weight="400" fill="#9885b5">vsync</text>
<rect x="60" y="1010" width="1045" height="110" rx="8" fill="#f8fafc" stroke="#e3e9ef" stroke-width="1.2"/>
<text x="80" y="1036" font-size="11" font-weight="700" fill="#182c43">READING THE DIAGRAM</text>
<text x="325" y="1035" font-size="12" font-weight="400" fill="#526b83">Solid: data or returned pose</text>
<text x="685" y="1035" font-size="12" font-weight="400" fill="#9885b5">Dashed: scheduled wake / observation</text>
<text x="80" y="1063" font-size="12" font-weight="400" fill="#4f647b">BLAS selection is global across eligible Eigen operations; OpenVINS is the main consumer.</text>
<text x="80" y="1084" font-size="12" font-weight="400" fill="#4f647b">FP32 BLAS is mixed precision; both Gemmini workers use hart 0 (FP32 custom3 / INT8 custom2).</text>
<text x="80" y="1105" font-size="12" font-weight="400" fill="#4f647b">Render and timewarp model GPU latency. Presentation is modeled; no shaders or physical display.</text>
<text x="60" y="1151" font-size="11" font-weight="400" fill="#738397">Native editable shapes, grouped cards and attached connectors</text></svg>
